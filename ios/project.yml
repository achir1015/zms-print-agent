name: ZMSPrintAgent
options:
  bundleIdPrefix: com.achir
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "10000"
targets:
  ZMSPrintAgent:
    type: application
    platform: iOS
    sources:
      - path: ZMSPrintAgent
      - path: web            # 和線上版同一份網頁（sync.sh 從 ../docs 複製進來），整個資料夾放進 App → 離線也能用
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.achir.zmsprintagent
        TARGETED_DEVICE_FAMILY: "1,2"     # iPhone 與 iPad
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 7BN6XJ59KP      # Apple Developer Program；換帳號就改這裡
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: ZMSPrintAgent/Info.plist
      properties:
        CFBundleDisplayName: 3D列印AI代理人
        CFBundleDevelopmentRegion: zh_TW
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Light
        # 直放、橫放都可以
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  ZMSPrintAgent:
    build:
      targets:
        ZMSPrintAgent: all
    run:
      config: Debug
    archive:
      config: Release
